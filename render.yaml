# Render blueprint for the Distributed Job Scheduler backend.
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo -> Apply.
#
# This provisions the NestJS API (apps/api) only. Render allows just ONE free
# Postgres per account, so this blueprint does NOT create a database. Reuse your
# existing Postgres: after applying, open the job-scheduler-api service ->
# Environment -> set DATABASE_URL to your Postgres "External Database URL"
# (works with DATABASE_SSL=true, which is preset below).
#
# After it's live, copy the API service's URL (e.g. https://job-scheduler-api.onrender.com)
# and set NEXT_PUBLIC_API_URL to it on your frontend host, then redeploy the frontend.
#
# The background worker (job execution) is included but commented out because
# Render's "worker" service type requires a paid plan. The site (signup/login/
# dashboard) works without it; jobs just won't be picked up until it runs.

services:
  - type: web
    name: job-scheduler-api
    runtime: node
    plan: free
    # Render auto-detects pnpm from pnpm-lock.yaml.
    buildCommand: pnpm install && pnpm --filter shared build && pnpm --filter api build
    startCommand: pnpm --filter api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      # Set this in the dashboard to your existing Postgres External Database URL.
      - key: DATABASE_URL
        sync: false
      # Optional: lock CORS to your dashboard origin instead of reflecting it.
      # - key: CORS_ORIGIN
      #   value: https://your-dashboard-url

  # --- Optional background worker (requires a paid Render plan) ---
